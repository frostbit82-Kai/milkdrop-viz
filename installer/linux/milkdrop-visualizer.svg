<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#181828"/>
      <stop offset="1" stop-color="#0a0a12"/>
    </linearGradient>
    <linearGradient id="drop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6ee7ff"/>
      <stop offset="0.55" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#ff4fa3"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="26" fill="url(#bg)"/>
  <!-- The drop: a circle with its top pulled to a point. -->
  <path d="M64 22 C 84 48, 96 62, 96 76 a 32 32 0 0 1 -64 0 C 32 62, 44 48, 64 22 Z"
        fill="url(#drop)"/>
  <path d="M52 66 a 18 18 0 0 0 4 20" fill="none" stroke="#ffffff" stroke-opacity="0.55"
        stroke-width="4" stroke-linecap="round"/>
  <!-- Waveform underneath, the audio the drop reacts to. -->
  <g stroke="#6ee7ff" stroke-width="5" stroke-linecap="round" opacity="0.85">
    <path d="M18 104 v-10"/><path d="M32 108 v-18"/><path d="M46 102 v-6"/>
    <path d="M82 102 v-6"/><path d="M96 108 v-18"/><path d="M110 104 v-10"/>
  </g>
</svg>
